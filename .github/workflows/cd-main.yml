# main CD 파이프라인. develop은 CI만(ci-api-server.yml/
# ci-inference-service.yml), main은 테스트 → Docker 이미지 빌드 →
# Docker Hub push까지 — 여기까지가 GitHub Actions의 역할이다. 이미지를
# pull해서 실제로 컨테이너를 올리는(재)배포는 서버(VirtualBox VM 등)에서
# docker compose pull && docker compose up -d로 한다 — 이 워크플로우는
# 그 부분을 다루지 않는다.
#
# self-hosted runner가 필요 없다. "이미지를 만들어서 registry에
# 올린다"까지만 하므로 GitHub이 제공하는 ubuntu-latest에서 전부 끝난다.
#
# test-api-server/test-inference-service를 ci-api-server.yml/
# ci-inference-service.yml의 workflow_call로 재사용하지 않고 이 파일
# 안에 그대로 인라인했다 — main 파이프라인이 develop CI 파일의 변경에
# 영향받지 않고 독립적으로 동작하게 하기 위해서다. 대신 두 파일이
# 갈라지지 않도록 api-server/inference-service 쪽 검증 스텝을 고치면
# 양쪽 다 같이 봐야 한다.
#
# 필요한 저장소 설정 (Settings > Secrets and variables > Actions):
#   Variables — DOCKERHUB_USERNAME(Docker Hub 로그인 계정명),
#               DOCKERHUB_NAMESPACE(이미지 태그 앞에 붙는 네임스페이스.
#               로그인 계정과 다를 수 있어 별도로 뒀다)
#   Secrets   — DOCKERHUB_TOKEN(비밀번호 아님, Docker Hub Access Token)
name: Test and publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

# main에 짧은 시간에 커밋이 연달아 올라오면 이전 실행은 취소한다 —
# 어차피 최신 커밋의 이미지만 의미가 있다. 진행 중이던 push가 취소돼도
# 레지스트리에는 그때까지 올라간 레이어만 남고, 다음 실행이 나머지를
# 이어 올리므로 이미지가 깨지지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-api-server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: api-server/pom.xml

      - run: mvn -B test

  test-inference-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: inference-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            inference-service/requirements.txt
            inference-service/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  publish:
    needs:
      - test-api-server
      - test-inference-service

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push api-server
        uses: docker/build-push-action@v6
        with:
          context: ./api-server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/posture-api-server:main
            ${{ vars.DOCKERHUB_NAMESPACE }}/posture-api-server:${{ github.sha }}

      - name: Build and push inference-service
        uses: docker/build-push-action@v6
        with:
          context: ./inference-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/posture-inference-service:main
            ${{ vars.DOCKERHUB_NAMESPACE }}/posture-inference-service:${{ github.sha }}
